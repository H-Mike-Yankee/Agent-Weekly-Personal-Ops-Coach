name: Weekly Personal Ops Report

on:
  schedule:
    # Every Sunday at 18:00 UTC.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN needs write access to issues so the run can create the Issue.
  issues: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate report and create GitHub Issue
        run: python main.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}