name: Weekly Personal Ops Report

on:
  schedule:
    # Every Sunday at 18:00 UTC.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # The built-in GITHUB_TOKEN needs this to create Issues on your behalf.
  issues: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate report and create GitHub Issue
        run: python main.py
        env:
          # GitHub Actions cannot access your laptop's private data/ files.
          # This run therefore uses the committed TEST FIXTURE feed and marks
          # the output as DEMO so the Issue is never mistaken for personal data.
          JOB_APPLICATIONS_FILE: tests/fixtures/job_applications.csv
          FLYRANK_PROGRESS_FILE: tests/fixtures/flyrank_progress.md
          STUDY_NOTES_FILE: tests/fixtures/study_notes.md
          DEMO_MODE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}